name: On default

on:
  push:
    branches: [ develop ]
    paths-ignore: [ '*.md' ]

  pull_request:
    branches: [ develop ]
    paths-ignore: [ '*.md' ]

jobs:
  build:
    name: Default
    uses: ./.github/workflows/base.yml
    permissions:
      contents: read
    with:
      release: false
    secrets: inherit
